apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: java-app
spec:
  replicas: 5
  selector:
    matchLabels:
      microservice: api
      app: java-app
  template:
    metadata:
      labels:
        microservice: api
        app: java-app
    spec:
      containers:
        - name: springboot-app
          image: gowthamarumugam/java-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "11111111111111111111"
            - name: COLOR
              value: "black"
          readinessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 5
          startupProbe:
            httpGet: 
              port: 8080
              path: /health
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 5