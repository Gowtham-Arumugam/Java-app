name: build and push docker image
on: 
  push:
    branches:
      - master
      - main
  workflow_dispatch:
jobs:
  build-and-push:
    name: Build and push docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu' 
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('app/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ hashFiles('app/pom.xml') }}
      - run: cd app && mvn test compile package
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/java-app:latest app/
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/java-app:latest