name: SonarQube & trivy code analysis
on: 
  push:
    branches:
      - feature/*
      - bugfix/*
      - master
jobs:
  code-analysis:
    name: Code analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu' 
      - run: cd app && mvn test compile package
      - name: Build and analyze
        uses: sonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}