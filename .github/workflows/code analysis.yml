name: SonarQube & trivy code analysis
on: 
  push:
    branches:
      - feature/*
      - master
jobs:
  code-analysis:
    name: Code analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu' 
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - run: cd app && mvn test compile package
      - name: Build and analyze
        uses: sonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Build Docker Image
        run: docker build -t java-app:latest app/
  scan-docker-image:
    uses: Gowtham-Arumugam/utilities/.github/workflows/scan-docker-image.yaml@main
    with:
      docker_image: java-app:latest
        